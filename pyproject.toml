[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthstone-study-assistant"
version = "0.1.0"
description = "一步一步开发的个人炉石传说学习助手"
requires-python = ">=3.11"
dependencies = ["python-dotenv==1.0.1", "httpx==0.28.1", "langchain-deepseek==1.1.1",
                "langchain-core==1.7.3", "langchain-openai==1.7.3", "langgraph==1.2.20", "mcp==1.30.0",
                "fastapi==0.162.5", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
include = ["hearthstone_assistant*"]
